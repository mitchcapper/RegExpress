name: Build RegExpressWPFNET

on:
  push:
    branches-ignore:
      - trash

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RegExpressWPFNET/RegExpressWPFNET.slnx

      - name: Build solution
        run: dotnet build RegExpressWPFNET/RegExpressWPFNET.slnx --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish RegExpressWPFNET/RegExpressWPFNET/RegExpressWPFNET.csproj --configuration Release --output ./publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegExpressWPFNET
          path: ./publish
          retention-days: 30
